name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and Zip Extensions
        run: |
          # 顺序执行: package.json 中的 run-p 并行器(npm-run-all@4)不兼容 4 段版本号(非 semver),
          # 且 bun run 嵌套脚本存在子进程不退出的问题, 故直接调用 wxt 二进制
          ./node_modules/.bin/wxt zip -b chrome
          ./node_modules/.bin/wxt zip -b firefox --mv3
          ./node_modules/.bin/wxt zip -b edge

      - name: Prepare release
        run: |
          mkdir release
          cp .output/*.zip release/
          rm -f release/*sources.zip
          ls -lah release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boss-helper
          path: release
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: boss-helper
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: dist/*
