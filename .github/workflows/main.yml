name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # --ignore-scripts: wxt prepare(postinstall) 在类型生成后进程不退出,
        # 会导致 install 阶段挂起; 构建时 wxt 会自行生成所需类型
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and Zip Extensions
        run: |
          # wxt 类型生成阶段存在进程不退出的挂起问题, 用 timeout 终止,
          # 以 zip 产物是否生成作为构建成功与否的判据
          rm -f .output/*.zip
          timeout 180 ./node_modules/.bin/wxt zip -b chrome || true
          timeout 180 ./node_modules/.bin/wxt zip -b firefox --mv3 || true
          timeout 180 ./node_modules/.bin/wxt zip -b edge || true
          ls -lah .output/*.zip
          test -f .output/boss-helper-*-chrome.zip
          test -f .output/boss-helper-*-firefox.zip
          test -f .output/boss-helper-*-edge.zip

      - name: Prepare release
        run: |
          mkdir release
          cp .output/*.zip release/
          rm -f release/*sources.zip
          ls -lah release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boss-helper
          path: release
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: boss-helper
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: dist/*
